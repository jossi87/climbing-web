server {
    listen 80;

    # The ARD manifest (`index.html` advertises it with `<link rel="ard" href="/.well-known/ard.json">`, and the
    # auditor/registry that reads that link requests exactly that path) has to answer `200 application/json` on every
    # domain. The document is not written here, because ARD wants an absolute `url` and an identifier whose publisher
    # is the domain being answered, and one build of this image serves brattelinjer.no, buldreinfo.com and
    # is.brattelinjer.no. climbing-ws owns it (`MetaController#getArdJson`) and derives all of that from the request,
    # so this one path is proxied there; everything else in `/.well-known/` stays local (block below).
    #
    # `Host` and `X-Forwarded-Host` have to survive: climbing-ws looks the site up with `request.getServerName()` and
    # runs `server.forward-headers-strategy=framework`, so a rewritten Host answers
    # `500 Invalid serverName=varden-climbing-ws` instead of a manifest. The path is rewritten to `/api/...` because
    # that controller sits under the API context. No `X-Forwarded-Proto`: nothing in the manifest depends on the
    # scheme (`Setup.url()` is `https://` plus the domain from the database), and the upstream's
    # `Cache-Control: public, max-age=3600` is passed through untouched since no `add_header` here overrides it.
    #
    # The upstream name sits in a variable on purpose: nginx resolves a literal `proxy_pass` host once, when the
    # config loads, and this container must not refuse to start just because the API container has no DNS entry at
    # that moment (compose declares no `depends_on` between the two). With a variable the lookup happens per request
    # through Docker's embedded resolver.
    location = /.well-known/ard.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $climbing_ws http://varden-climbing-ws:8080;
        proxy_pass $climbing_ws/api/.well-known/ard.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RFC 9116 wants `/.well-known/security.txt` on the domain it describes, and its mandatory `Expires` (at most a
    # year out, never in the past) has to come from a clock rather than a file baked into the image. climbing-ws
    # renders it per domain in `MetaController#getSecurityTxt`; same proxy reasoning as the ARD block above,
    # including why the path becomes `/api/...` and why the upstream sits in a variable. The upstream's
    # `Cache-Control: public, max-age=86400` is passed through untouched since no `add_header` overrides it here.
    location = /.well-known/security.txt {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $climbing_ws http://varden-climbing-ws:8080;
        proxy_pass $climbing_ws/api/.well-known/security.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Every other `/.well-known/*` path stops here instead of reaching the SPA fallback below: without this block an
    # unknown `/.well-known/*` path hit `try_files ... /index.html` and answered `200 text/html` with the app shell,
    # which is how `/.well-known/ai-catalog.json` came back as `<!doctype html>` and made Lighthouse's ARD audit
    # report "Malformed JSON ... Unexpected token '<'" instead of a plain 404. `=404` keeps the app shell out of the
    # namespace for manifests we do not publish (an exact match above wins over this prefix, whatever the order). If
    # a document is ever added to this image, give it its own `add_header Cache-Control`: unhashed files otherwise
    # get no header at all, and the heuristic browsers and CDNs then fall back to can pin a stale copy for days.
    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # `max-age=0, must-revalidate` instead of `no-store`: the HTML must still be revalidated on every navigation,
        # but `no-store` forbade the browser from keeping a copy at all, so each visit paid a full HTML download and
        # the back/forward cache had nothing to restore. With revalidation the browser sends the validator (ETag /
        # Last-Modified) and the usual answer is a `304 Not Modified` of a few hundred bytes. `public` keeps shared
        # caches (CDN, proxy) in the loop — `no-store` also told them not to store it, which is partly why every HTML
        # request reached the origin.
        # (nginx has no block comments: only `#` to end of line.)
        if ($request_filename ~* \.(html)$ ) {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }

    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Content-hashed build output (`assetsDir`): the URL changes with the content, so `immutable` is safe here and
    # skips the revalidation round-trips a reload otherwise makes. Unhashed files copied from `public/` (favicon,
    # logos, weather icons, PDFs) stay on the block above without `immutable` so a redeploy can still replace them.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
