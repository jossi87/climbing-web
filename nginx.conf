server {
    listen 80;

    # The ARD manifest is deliberately not in this image: climbing-ws owns it (`MetaController#getArdJson`), because
    # ARD wants an absolute `url` and a publisher that names the host being answered, while one build here serves
    # three domains. The proxy in front sends exactly `/.well-known/ard.json` there
    # (`proxy_pass http://varden-climbing-ws:8080/api/.well-known/ard.json`), and that controller sets the
    # `Cache-Control: public, max-age=3600` for it.
    #
    # This block stays for every other `/.well-known/*` path, and it has to come before the SPA fallback below:
    # without it an unknown `/.well-known/*` path hit `try_files ... /index.html` and answered `200 text/html` with
    # the app shell, which is how `/.well-known/ai-catalog.json` came back as `<!doctype html>` and made
    # Lighthouse's ARD audit report "Malformed JSON ... Unexpected token '<'" instead of a plain 404. `=404` keeps
    # the app shell out of the namespace for manifests we do not publish. If a document is ever served from this
    # image again, give it its own `add_header Cache-Control`: unhashed files otherwise get no header at all, and
    # the heuristic browsers and CDNs then fall back to can pin a stale copy for days.
    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # `max-age=0, must-revalidate` instead of `no-store`: the HTML must still be revalidated on every navigation,
        # but `no-store` forbade the browser from keeping a copy at all, so each visit paid a full HTML download and
        # the back/forward cache had nothing to restore. With revalidation the browser sends the validator (ETag /
        # Last-Modified) and the usual answer is a `304 Not Modified` of a few hundred bytes. `public` keeps shared
        # caches (CDN, proxy) in the loop — `no-store` also told them not to store it, which is partly why every HTML
        # request reached the origin.
        # (nginx has no block comments: only `#` to end of line.)
        if ($request_filename ~* \.(html)$ ) {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }

    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Content-hashed build output (`assetsDir`): the URL changes with the content, so `immutable` is safe here and
    # skips the revalidation round-trips a reload otherwise makes. Unhashed files copied from `public/` (favicon,
    # logos, weather icons, PDFs) stay on the block above without `immutable` so a redeploy can still replace them.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
